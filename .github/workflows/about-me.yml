name: Banner

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/about-me/**"
      - ".github/workflows/about-me.yml"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
      squash:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check out the generated branch
        uses: actions/checkout@v4
        with:
          ref: generated
          path: gen

      - name: Build frames and swap in the current one
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python3 .github/scripts/about-me/build.py --gen gen --docs gen/docs --message "$RUNNER_TEMP/msg" $FORCE

      - name: Publish to the generated branch
        working-directory: gen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/msg"
          for attempt in 1 2 3 4; do
            git push -q origin HEAD:generated && exit 0
            sleep $((attempt * 5))
            git fetch -q --depth=50 origin generated
            git rebase -q origin/generated
          done
          exit 1

      - name: Squash the generated branch's history past a month of commits
        working-directory: gen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api -i "repos/${{ github.repository }}/commits?sha=generated&per_page=1" | grep -i '^link:' | grep -oE 'page=[0-9]+>; rel="last"' | grep -oE '[0-9]+' || true)
          if [ "${{ inputs.squash }}" != "true" ] && [ "${count:-1}" -le 4500 ]; then exit 0; fi
          git fetch -q --depth=1 origin generated
          tip=$(git rev-parse FETCH_HEAD)
          root=$(git commit-tree "$tip^{tree}" -m "generated: history squashed (${count:-1} commits)")
          git push -q --force-with-lease="refs/heads/generated:$tip" origin "${root}:refs/heads/generated" || echo "generated moved on; trying again next run"

      - name: Keep the schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/about-me.yml/enable"
